<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="header">
        <a href="../home/home.html" class="header-link">
            <img src="../home/logo2.png" alt="Belgium Campus Logo" class="header-logo">
            <span class="header-logo-text">Belgium Campus</span>
        </a>
    </header>

    <main class="login-container">
        <section class="login-header">
            <h1>Student Login</h1>
        </section>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Login</button>
        </form>
        <p id="error-message" role="alert"></p>
    </main>

    <nav class="home-link">
        <a href="/home/home.html">Return to Home Page</a>
    </nav>
    
    <script src="login.js"></script>
    
    <footer>
        <section class="footer-content">
            <nav>
                <ul>
                    <li><a href="#" aria-label="Privacy Policy">Privacy Policy</a></li>
                    <li><a href="#" aria-label="Terms of Service">Terms of Service</a></li>
                    <li><a href="#" aria-label="Contact Us">Contact Us</a></li>
                </ul>
            </nav>
            <p>&copy; 2024 Hayley Treutens (578003), Kyle Smith (577999), Zirong Luo (600287), Jonathan Joubert (578085). All rights reserved.</p>
        </section>
    </footer>
</body>
</html>
