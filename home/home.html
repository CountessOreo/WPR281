<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search for a course...">
        <button id="searchButton">Search</button>
    </div>

    <div id="courseList"></div>

    <div id="courseDetails" style="display: none;">
        <h2 id="courseTitle"></h2>
        <p id="courseDescription"></p>
        <button id="printButton">Print Course</button>
        <button id="enrollButton" style="display: none;">Enroll in this Course</button>
        <button id="viewCompletedModulesButton" style="display: none;">View Completed Modules</button>
        <table id="moduleTable">
            <thead>
                <tr>
                    <th>Module</th>
                    <th>Lecturer</th>
                    <th>Venue</th>
                    <th>Links</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id="printableSection" style="display: none;">
            <h1 id="printableCourseTitle"></h1>
            <p id="printableCourseDescription"></p>
            <table id="printableModuleTable">
                <thead>
                    <tr>
                        <th>Module</th>
                        <th>Lecturer</th>
                        <th>Venue</th>
                        <th>Links</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="completedModulesSection" style="display: none;">
        <h2>Completed Modules</h2>
        <ol id="completedModulesList"></ol>
        <button id="backButton">Back to Course List</button>
    </div>

    <script src="home.js"></script>
</body>
</html>
