<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll in Course</title>
    <link rel="stylesheet" href="enroll.css">
</head>
<body>
    <div class="enroll-container">
        <nav>
            <a href="/home/home.html">&#8592 Back</a>
        </nav>
        <h1>Enroll <span style="color: black;">in a</span> <span style="color: #ebe831;">Course</span></h1>
        <form id="enrollForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="HIC001">Higher Certificate</option>
                <option value="DIP001">Diploma</option>
                <option value="BIT001">BIT</option>
                <option value="BCOM001">BCOM</option>
            </select>
            
            <button type="submit" class="btn btn-background-slide" onclick="changeButtonText()" id="btn">Enroll</button>
        </form>
        <div id="countdown" class="countdown"></div>

    </div>
    <script src="enroll.js"></script>
</body>
</html>
